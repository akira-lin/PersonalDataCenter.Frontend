<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人数据中心 - Personal Data Center</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        header p {
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 24px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .tab-btn.active {
            background: white;
            color: #667eea;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.875rem;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th,
        .data-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e1e1e1;
        }

        .data-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
        }

        .data-table tr:hover {
            background: #f8f9fa;
        }

        .data-table tr:last-child td {
            border-bottom: none;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .pagination button {
            padding: 8px 16px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination .current {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-bar input {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card .number {
            font-size: 2.5rem;
            font-weight: bold;
        }

        .stat-card .label {
            opacity: 0.9;
        }

        .task-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.875rem;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-running {
            background: #cce5ff;
            color: #004085;
        }

        .status-completed {
            background: #d4edda;
            color: #155724;
        }

        .status-failed {
            background: #f8d7da;
            color: #721c24;
        }

        .hidden {
            display: none !important;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 16px 24px;
            background: #333;
            color: white;
            border-radius: 8px;
            animation: slideIn 0.3s ease;
        }

        .toast.success {
            background: #28a745;
        }

        .toast.error {
            background: #dc3545;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        footer {
            text-align: center;
            color: white;
            opacity: 0.8;
            margin-top: 40px;
        }

        footer a {
            color: white;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }

            .data-table {
                font-size: 0.875rem;
            }

            .data-table th,
            .data-table td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 个人数据中心</h1>
            <p>Personal Data Center - .NET P6 架构师实战项目/p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" data-tab="data">数据管理</button>
            <button class="tab-btn" data-tab="crawl">数据采集</button>
            <button class="tab-btn" data-tab="excel">Excel 导入/导出</button>
        </div>

        <!-- 数据管理 Tab -->
        <div id="tab-data" class="tab-content">
            <div class="stats">
                <div class="stat-card">
                    <div class="number" id="total-count">0</div>
                    <div class="label">总数据量</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="category-count">0</div>
                    <div class="label">分类：</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="today-count">0</div>
                    <div class="label">今日新增</div>
                </div>
            </div>

            <div class="card">
                <h2>添加/编辑数据</h2>
                <form id="data-form">
                    <input type="hidden" id="edit-id">
                    <div class="form-group">
                        <label>标题 *</label>
                        <input type="text" id="data-title" required>
                    </div>
                    <div class="form-group">
                        <label>描述</label>
                        <textarea id="data-description" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label>分类： *</label>
                        <input type="text" id="data-category" list="category-list" required>
                        <datalist id="category-list"></datalist>
                    </div>
                    <div class="form-group">
                        <label>来源URL</label>
                        <input type="url" id="data-source">
                    </div>
                    <div class="form-group">
                        <label>标签（逗号分隔：</label>
                        <input type="text" id="data-tags">
                    </div>
                    <button type="submit" class="btn btn-primary" id="submit-btn">添加数据</button>
                    <button type="button" class="btn btn-secondary hidden" id="cancel-btn" onclick="cancelEdit()">取消编辑</button>
                </form>
            </div>

            <div class="card">
                <h2>数据列表</h2>
                <div class="search-bar">
                    <input type="text" id="search-input" placeholder="搜索标题、描述或标签...">
                    <select id="filter-category">
                        <option value="">所有分类</option>
                    </select>
                    <button class="btn btn-primary" onclick="loadData(1)">搜索</button>
                </div>

                <div style="overflow-x: auto;">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>标题</th>
                                <th>分类：</th>
                                <th>来源</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="data-list"></tbody>
                    </table>
                </div>

                <div class="pagination" id="pagination"></div>
            </div>
        </div>

        <!-- 数据采集 Tab -->
        <div id="tab-crawl" class="tab-content hidden">
            <div class="card">
                <h2>创建采集任务</h2>
                <form id="crawl-form">
                    <div class="form-group">
                        <label>任务名称 *</label>
                        <input type="text" id="crawl-name" required placeholder="例如：科技新闻">
                    </div>
                    <div class="form-group">
                        <label>目标URL *</label>
                        <input type="url" id="crawl-url" required placeholder="https://example.com">
                    </div>
                    <button type="submit" class="btn btn-primary">创建并执行任务</button>
                </form>
            </div>

            <div class="card">
                <h2>快速提取</h2>
                <p style="margin-bottom: 15px; color: #666;">直接从一个URL提取数据（不保存任务）</p>
                <form id="extract-form">
                    <div class="form-group">
                        <label>URL *</label>
                        <input type="url" id="extract-url" required placeholder="https://example.com">
                    </div>
                    <div class="form-group">
                        <label>分类： *</label>
                        <input type="text" id="extract-category" required placeholder="例如：技术文章>
                    </div>
                    <button type="submit" class="btn btn-primary">提取数据</button>
                </form>
            </div>

            <div class="card">
                <h2>采集历史</h2>
                <div style="overflow-x: auto;">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>任务名称</th>
                                <th>URL</th>
                                <th>状态</th>
                                <th>采集数量</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="crawl-list"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Excel Tab -->
        <div id="tab-excel" class="tab-content hidden">
            <div class="card">
                <h2>导出数据</h2>
                <p style="margin-bottom: 15px; color: #666;">将数据导出为 Excel 文件，方便备份和分析</p>
                <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                    <button class="btn btn-primary" onclick="exportAll()">导出所有数据</button>
                    <select id="export-category" style="padding: 12px; border: 2px solid #e1e1e1; border-radius: 8px;">
                        <option value="">所有分类</option>
                    </select>
                    <button class="btn btn-secondary" onclick="exportByCategory()">按分类导出</button>
                </div>
            </div>

            <div class="card">
                <h2>导入数据</h2>
                <p style="margin-bottom: 15px; color: #666;">📥 Excel 文件导入数据（支持 .xlsx 和 .xls）</p>
                <form id="import-form">
                    <div class="form-group">
                        <label>选择文件 *</label>
                        <input type="file" id="import-file" accept=".xls）x,.xls）" required>
                    </div>
                    <div class="form-group">
                        <label>默认分类：</label>
                        <input type="text" id="import-category" placeholder="如果Excel中没有分类：，使用此默认值">
                    </div>
                    <button type="submit" class="btn btn-primary">导入数据</button>
                </form>
            </div>
        </div>

        <footer>
            <p>基于 .NET 9 + Vue.js 构建 | <a href="https://github.com" target="_blank">GitHub</a></p>
        </footer>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script>
        // API 配置
        const API_BASE = 'http://api.myhr.dpdns.org:5000/api';

        // 状态        let currentPage = 1;
        let currentTab = 'data';

        // ========== 初始化==========
        document.addEventListener('DOMContentLoaded', () => {
            initTabs();
            initForms();
            loadData(1);
            loadCrawlTasks();
            loadCategories();
        });

        // ========== Tab 切换 ==========
        function initTabs() {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const tab = btn.dataset.tab;
                    switchTab(tab);
                });
            });
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
            
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
        }

        // ========== 表单初始化==========
        function initForms() {
            document.getElementById('data-form').addEventListener('submit', handleDataSubmit);
            document.getElementById('crawl-form').addEventListener('submit', handleCrawlSubmit);
            document.getElementById('extract-form').addEventListener('submit', handleExtractSubmit);
            document.getElementById('import-form').addEventListener('submit', handleImportSubmit);
            
            document.getElementById('search-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') loadData(1);
            });
        }

        // ========== 数据管理 ==========
        async function loadData(page = 1) {
            currentPage = page;
            const search = document.getElementById('search-input').value;
            const category = document.getElementById('filter-category').value;

            try {
                let url = `${API_BASE}/DataItem?page=${page}&pageSize=10`;
                if (search) url += `&search=${encodeURIComponent(search)}`;
                if (category) url += `&category=${encodeURIComponent(category)}`;

                const res = await fetch(url);
                const data = await res.json();

                renderDataList(data.items);
                renderPagination(data.total, data.page, data.pageSize);
                updateStats(data.total);
            } catch (err) {
                showToast('加载数据失败: ' + err.message, 'error');
            }
        }

        function renderDataList(items) {
            const tbody = document.getElementById('data-list');
            if (!items.length) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;">暂无数据</td></tr>';
                return;
            }

            tbody.innerHTML = items.map(item => `
                <tr>
                    <td>${item.id}</td>
                    <td>
                        <strong>${escapeHtml(item.title)}</strong>
                        ${item.description ? `<br><small style="color:#666;">${escapeHtml(item.description.substring(0, 50))}...</small>` : ''}
                    </td>
                    <td><span class="task-status status-completed">${escapeHtml(item.category)}</span></td>
                    <td>${item.sourceUrl ? `<a href="${escapeHtml(item.sourceUrl)}" target="_blank" style="color:#667eea;">链接</a>` : '-'}</td>
                    <td>${new Date(item.createdAt).toLocaleDateString()}</td>
                    <td>
                        <div class="actions">
                            <button class="btn btn-secondary btn-sm" onclick="editItem(${item.id})">编辑</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteItem(${item.id})">删除</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function renderPagination(total, page, pageSize) {
            const totalPages = Math.ceil(total / pageSize);
            const container = document.getElementById('pagination');
            
            let html = `<button ${page === 1 ? 'disabled' : ''} onclick="loadData(${page - 1})">上一页</button>`;
            
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= page - 2 && i <= page + 2)) {
                    html += `<button class="${i === page ? 'current' : ''}" onclick="loadData(${i})">${i}</button>`;
                } else if (i === page - 3 || i === page + 3) {
                    html += `<span style="padding:0 8px;">...</span>`;
                }
            }
            
            html += `<button ${page === totalPages ? 'disabled' : ''} onclick="loadData(${page + 1})">下一页</button>`;
            
            container.innerHTML = html;
        }

        async function updateStats(total) {
            document.getElementById('total-count').textContent = total;
            
            try {
                const res = await fetch(`${API_BASE}/DataItem?page=1&pageSize=1`);
                const data = await res.json();
                
                // 获取分类：数（从所有数据中统计）                const allRes = await fetch(`${API_BASE}/DataItem?pageSize=1000`);
                const allData = await allRes.json();
                const categories = new Set(allData.items.map(i => i.category));
                document.getElementById('category-count').textContent = categories.size;
                
                // 今日新增
                const today = new Date().toDateString();
                const todayCount = allData.items.filter(i => 
                    new Date(i.createdAt).toDateString() === today
                ).length;
                document.getElementById('today-count').textContent = todayCount;
            } catch (err) {
                console.error('更新统计）失败', err);
            }
        }

        async function handleDataSubmit(e) {
            e.preventDefault();
            
            const id = document.getElementById('edit-id').value;
            const dto = {
                title: document.getElementById('data-title').value,
                description: document.getElementById('data-description').value,
                category: document.getElementById('data-category').value,
                sourceUrl: document.getElementById('data-source').value || null,
                tags: document.getElementById('data-tags').value || null
            };

            try {
                const url = id ? `${API_BASE}/DataItem/${id}` : `${API_BASE}/DataItem`;
                const method = id ? 'PUT' : 'POST';
                
                const res = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dto)
                });

                if (!res.ok) throw new Error('保存存失败');
                
                showToast(id ? '更新成功' : '添加成功', 'success');
                resetForm();
                loadData(1);
                loadCategories();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        async function editItem(id) {
            try {
                const res = await fetch(`${API_BASE}/DataItem/${id}`);
                const item = await res.json();

                document.getElementById('edit-id').value = item.id;
                document.getElementById('data-title').value = item.title;
                document.getElementById('data-description').value = item.description;
                document.getElementById('data-category').value = item.category;
                document.getElementById('data-source').value = item.sourceUrl || '';
                document.getElementById('data-tags').value = item.tags || '';
                
                document.getElementById('submit-btn').textContent = '更新数据';
                document.getElementById('cancel-btn').classList.remove('hidden');
                
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (err) {
                showToast('获取数据失败', 'error');
            }
        }

        function cancelEdit() {
            resetForm();
        }

        function resetForm() {
            document.getElementById('data-form').reset();
            document.getElementById('edit-id').value = '';
            document.getElementById('submit-btn').textContent = '添加数据';
            document.getElementById('cancel-btn').classList.add('hidden');
        }

        async function deleteItem(id) {
            if (!confirm('确定要删除这条数据吗')) return;

            try {
                const res = await fetch(`${API_BASE}/DataItem/${id}`, { method: 'DELETE' });
                if (!res.ok) throw new Error('删除失败');
                
                showToast('删除成功', 'success');
                loadData(currentPage);
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        // ========== 数据采集 ==========
        async function loadCrawlTasks() {
            try {
                const res = await fetch(`${API_BASE}/CrawlTasks`);
                const tasks = await res.json();
                
                const tbody = document.getElementById('crawl-list');
                if (!tasks.length) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;">暂无采集任务</td></tr>';
                    return;
                }

                tbody.innerHTML = tasks.map(task => `
                    <tr>
                        <td>${task.id}</td>
                        <td>${escapeHtml(task.name)}</td>
                        <td><a href="${escapeHtml(task.url)}" target="_blank" style="color:#667eea;">链接</a></td>
                        <td><span class="task-status status-${task.status.toLowerCase()}">${task.status}</span></td>
                        <td>${task.itemsCollected}</td>
                        <td>${new Date(task.createdAt).toLocaleString()}</td>
                        <td>
                            ${task.status === 'Pending' ? `<button class="btn btn-primary btn-sm" onclick="runTask(${task.id})">执行完成</button>` : ''}
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                showToast('加载任务失败: ' + err.message, 'error');
            }
        }

        async function handleCrawlSubmit(e) {
            e.preventDefault();
            
            const dto = {
                name: document.getElementById('crawl-name').value,
                url: document.getElementById('crawl-url').value
            };

            try {
                // 创建并执行任务                const res = await fetch(`${API_BASE}/CrawlTasks`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dto)
                });

                const task = await res.json();
                
                showToast('任务已创建，开始执行..', 'success');
                
                // 执行任务务
                await fetch(`${API_BASE}/CrawlTasks/${task.id}/run`, { method: 'POST' });
                
                document.getElementById('crawl-form').reset();
                loadCrawlTasks();
                loadData(1);
            } catch (err) {
                showToast('创建任务失败: ' + err.message, 'error');
            }
        }

        async function handleExtractSubmit(e) {
            e.preventDefault();
            
            const dto = {
                url: document.getElementById('extract-url').value,
                category: document.getElementById('extract-category').value
            };

            try {
                showToast('正在提取数据，请等待..', 'success');
                
                const res = await fetch(`${API_BASE}/CrawlTasks/extract`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dto)
                });

                const items = await res.json();
                
                if (items.length) {
                    // 批量保存存
                    const dtos = items.map(i => ({
                        title: i.title,
                        description: i.description,
                        category: i.category,
                        sourceUrl: i.sourceUrl
                    }));

                    await fetch(`${API_BASE}/DataItem/bulk`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(dtos)
                    });
                    
                    showToast(`成功提取并保存${items.length} 条数据`, 'success');
                    document.getElementById('extract-form').reset();
                    loadData(1);
                    switchTab('data');
                } else {
                    showToast('未能从该页面提取到数据, 'error');
                }
            } catch (err) {
                showToast('提取失败: ' + err.message, 'error');
            }
        }

        async function runTask(id) {
            try {
                showToast('任务执行完成..', 'success');
                await fetch(`${API_BASE}/CrawlTasks/${id}/run`, { method: 'POST' });
                loadCrawlTasks();
                loadData(1);
            } catch (err) {
                showToast('执行任务务失败', 'error');
            }
        }

        // ========== Excel ==========
        async function loadCategories() {
            try {
                const res = await fetch(`${API_BASE}/DataItem?pageSize=1000`);
                const data = await res.json();
                
                const categories = [...new Set(data.items.map(i => i.category))];
                
                ['filter-category', 'export-category'].forEach(id => {
                    const select = document.getElementById(id);
                    select.innerHTML = '<option value="">所有分类</option>' + 
                        categories.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
                });

                const datalist = document.getElementById('category-list');
                datalist.innerHTML = categories.map(c => `<option value="${escapeHtml(c)}">`).join('');
            } catch (err) {
                console.error('加载分类：失败', err);
            }
        }

        function exportAll() {
            window.location.href = `${API_BASE}/Excel/export`;
        }

        function exportByCategory() {
            const category = document.getElementById('export-category').value;
            let url = `${API_BASE}/Excel/export`;
            if (category) url += `?category=${encodeURIComponent(category)}`;
            window.location.href = url;
        }

        async function handleImportSubmit(e) {
            e.preventDefault();
            
            const file = document.getElementById('import-file').files[0];
            const category = document.getElementById('import-category').value || '未分类';

            if (!file) {
                showToast('请选择文件', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);
            formData.append('category', category);

            try {
                showToast('导入中，请等待..', 'success');
                
                const res = await fetch(`${API_BASE}/Excel/import?category=${encodeURIComponent(category)}`, {
                    method: 'POST',
                    body: formData
                });

                const result = await res.json();
                
                if (res.ok) {
                    showToast(result.message, 'success');
                    document.getElementById('import-form').reset();
                    loadData(1);
                    loadCategories();
                    switchTab('data');
                } else {
                    showToast(result.message, 'error');
                }
            } catch (err) {
                showToast('导入失败: ' + err.message, 'error');
            }
        }

        // ========== 工具函数 ==========
        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function showToast(message, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            toast.classList.remove('hidden');
            
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }
    </script>
</body>
</html>
