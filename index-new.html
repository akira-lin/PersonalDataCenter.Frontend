<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Data Center</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; color: white; margin-bottom: 30px; }
        header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        header p { opacity: 0.9; }
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .card h2 { color: #333; margin-bottom: 20px; font-size: 1.5rem; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #555; font-weight: 500; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 12px; border: 2px solid #e1e1e1;
            border-radius: 8px; font-size: 1rem; transition: border-color 0.3s;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none; border-color: #667eea;
        }
        .btn {
            padding: 12px 24px; border: none; border-radius: 8px;
            cursor: pointer; font-size: 1rem; transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102,126,234,0.4); }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-sm { padding: 6px 12px; font-size: 0.875rem; }
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th, .data-table td {
            padding: 12px; text-align: left; border-bottom: 1px solid #e1e1e1;
        }
        .data-table th { background: #f8f9fa; font-weight: 600; color: #333; }
        .data-table tr:hover { background: #f8f9fa; }
        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
        .pagination button {
            padding: 8px 16px; border: 1px solid #ddd; background: white;
            border-radius: 4px; cursor: pointer;
        }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
        .pagination .current { background: #667eea; color: white; border-color: #667eea; }
        .search-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .search-bar input { flex: 1; min-width: 200px; padding: 12px; border: 2px solid #e1e1e1; border-radius: 8px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; padding: 20px; border-radius: 12px; text-align: center;
        }
        .stat-card .number { font-size: 2.5rem; font-weight: bold; }
        .stat-card .label { opacity: 0.9; }
        .actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .toast {
            position: fixed; bottom: 20px; right: 20px;
            padding: 16px 24px; background: #333; color: white;
            border-radius: 8px; animation: slideIn 0.3s ease; z-index: 9999;
        }
        .toast.success { background: #28a745; }
        .toast.error { background: #dc3545; }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .hidden { display: none !important; }
        .tag { display: inline-block; padding: 2px 8px; background: #e9ecef; border-radius: 12px; font-size: 0.75rem; margin-right: 4px; }
        footer { text-align: center; color: white; opacity: 0.8; margin-top: 40px; }
        @media (max-width: 768px) {
            header h1 { font-size: 1.8rem; }
            .data-table { font-size: 0.875rem; }
            .data-table th, .data-table td { padding: 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Personal Data Center</h1>
            <p>.NET Backend + Vanilla JS Frontend</p>
        </header>

        <div class="stats">
            <div class="stat-card">
                <div class="number" id="total-count">-</div>
                <div class="label">Total Records</div>
            </div>
            <div class="stat-card">
                <div class="number" id="category-count">-</div>
                <div class="label">Categories</div>
            </div>
            <div class="stat-card">
                <div class="number" id="today-count">-</div>
                <div class="label">Today Added</div>
            </div>
        </div>

        <!-- Data Form -->
        <div class="card">
            <h2 id="form-title">Add Data</h2>
            <form id="data-form">
                <input type="hidden" id="edit-id">
                <div class="form-group">
                    <label>Title *</label>
                    <input type="text" id="data-title" required placeholder="Enter data title">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="data-description" rows="3" placeholder="Description (optional)"></textarea>
                </div>
                <div class="form-group">
                    <label>Category *</label>
                    <input type="text" id="data-category" required placeholder="e.g., Work, Study, Life">
                </div>
                <div class="form-group">
                    <label>Source URL</label>
                    <input type="url" id="data-source" placeholder="https://example.com">
                </div>
                <div class="form-group">
                    <label>Tags (comma separated)</label>
                    <input type="text" id="data-tags" placeholder="tag1, tag2, tag3">
                </div>
                <button type="submit" class="btn btn-primary" id="submit-btn">Add Data</button>
                <button type="button" class="btn btn-secondary hidden" id="cancel-btn" onclick="cancelEdit()">Cancel</button>
            </form>
        </div>

        <!-- Data List -->
        <div class="card">
            <h2>Data List</h2>
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Search title, description or tags..." onkeypress="if(event.key==='Enter')loadData(1)">
                <select id="filter-category">
                    <option value="">All Categories</option>
                </select>
                <button class="btn btn-primary" onclick="loadData(1)">Search</button>
            </div>
            <div style="overflow-x:auto;">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title / Description</th>
                            <th>Category</th>
                            <th>Source</th>
                            <th>Created</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="data-list"><tr><td colspan="6" style="text-align:center;padding:40px;">Loading...</td></tr></tbody>
                </table>
            </div>
            <div class="pagination" id="pagination"></div>
        </div>

        <footer>
            <p>Personal Data Center &copy; 2026 | Powered by .NET + GitHub Pages</p>
        </footer>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script>
        // ========== API Config ==========
        const API_BASE = 'https://api.myhr.dpdns.org:2443/api';
        let currentPage = 1;

        // ========== Init ==========
        document.addEventListener('DOMContentLoaded', () => {
            loadData(1);
            loadCategories();
        });

        // ========== API Helper ==========
        async function api(url, options) {
            try {
                const res = await fetch(API_BASE + url, {
                    ...options,
                    headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return await res.json();
            } catch (err) {
                console.error('[API Error]', url, err);
                throw err;
            }
        }

        // ========== Load Data (Paginated) ==========
        async function loadData(page) {
            currentPage = page;
            const search = document.getElementById('search-input').value.trim();
            const category = document.getElementById('filter-category').value;

            try {
                let url = '/DataItem?page=' + page + '&pageSize=10';
                if (search) url += '&search=' + encodeURIComponent(search);
                if (category) url += '&category=' + encodeURIComponent(category);

                const data = await api(url);

                renderDataList(data.items || []);
                renderPagination(data.total || 0, data.page || 1, data.pageSize || 10);
                updateStats(data.total || 0);
            } catch (err) {
                showToast('Failed to load data: ' + err.message, 'error');
                document.getElementById('data-list').innerHTML =
                    '<tr><td colspan="6" style="text-align:center;padding:40px;color:#dc3545;">Error loading data. Check console for details.</td></tr>';
            }
        }

        // ========== Render Table ==========
        function renderDataList(items) {
            const tbody = document.getElementById('data-list');
            if (!items.length) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;">No data found.</td></tr>';
                return;
            }

            tbody.innerHTML = items.map(function(item) {
                var descHtml = item.description
                    ? '<br><small style="color:#666;display:block;margin-top:4px;">' + esc(item.description.substring(0, 80)) + (item.description.length > 80 ? '...' : '') + '</small>'
                    : '';
                var tagsHtml = item.tags
                    ? '<br>' + item.tags.split(',').map(function(t) { return '<span class="tag">' + esc(t.trim()) + '</span>'; }).join('')
                    : '';
                var sourceHtml = item.sourceUrl
                    ? '<a href="' + esc(item.sourceUrl) + '" target="_blank" style="color:#667eea;text-decoration:none;">Link</a>'
                    : '-';
                var timeStr = item.createdAt
                    ? new Date(item.createdAt).toLocaleString()
                    : '-';

                return '<tr>' +
                    '<td>' + item.id + '</td>' +
                    '<td><strong>' + esc(item.title) + '</strong>' + descHtml + tagsHtml + '</td>' +
                    '<td><span class="tag" style="background:#667eea;color:white;border:none;">' + esc(item.category) + '</span></td>' +
                    '<td>' + sourceHtml + '</td>' +
                    '<td style="white-space:nowrap;font-size:0.85rem;">' + timeStr + '</td>' +
                    '<td><div class="actions">' +
                        '<button class="btn btn-secondary btn-sm" onclick="editItem(' + item.id + ')">Edit</button> ' +
                        '<button class="btn btn-danger btn-sm" onclick="deleteItem(' + item.id + ')">Delete</button>' +
                    '</div></td>' +
                '</tr>';
            }).join('');
        }

        // ========== Render Pagination ==========
        function renderPagination(total, page, pageSize) {
            var totalPages = Math.ceil(total / pageSize) || 1;
            var container = document.getElementById('pagination');
            var html = '';

            html += '<button' + (page === 1 ? ' disabled' : '') + ' onclick="loadData(' + (page - 1) + ')">&laquo; Prev</button>';

            var start = Math.max(1, page - 2);
            var end = Math.min(totalPages, page + 2);
            if (start > 1) { html += '<button onclick="loadData(1)">1</button>'; if (start > 2) html += '<span style="padding:0 6px;">...</span>'; }
            for (var i = start; i <= end; i++) {
                html += '<button class="' + (i === page ? 'current' : '') + '" onclick="loadData(' + i + ')">' + i + '</button>';
            }
            if (end < totalPages) { if (end < totalPages - 1) html += '<span style="padding:0 6px;">...</span>'; html += '<button onclick="loadData(' + totalPages + ')">' + totalPages + '</button>'; }

            html += '<button' + (page === totalPages ? ' disabled' : '') + ' onclick="loadData(' + (page + 1) + ')">Next &raquo;</button>';
            html += '<span style="margin-left:12px;color:#666;font-size:0.85rem;line-height:34px;">Total: ' + total + '</span>';

            container.innerHTML = html;
        }

        // ========== Update Stats ==========
        async function updateStats(currentTotal) {
            document.getElementById('total-count').textContent = currentTotal;

            try {
                var data = await api('/DataItem?pageSize=1000');
                var items = data.items || [];

                var categories = [];
                items.forEach(function(i) { if (i.category && categories.indexOf(i.category) === -1) categories.push(i.category); });
                document.getElementById('category-count').textContent = categories.length;

                var today = new Date().toDateString();
                var todayCount = 0;
                items.forEach(function(i) {
                    if (i.createdAt && new Date(i.createdAt).toDateString() === today) todayCount++;
                });
                document.getElementById('today-count').textContent = todayCount;
            } catch (err) {
                console.error('Stats error:', err);
            }
        }

        // ========== Form Submit ==========
        document.getElementById('data-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            var id = document.getElementById('edit-id').value;
            var dto = {
                title: document.getElementById('data-title').value.trim(),
                description: document.getElementById('data-description').value.trim(),
                category: document.getElementById('data-category').value.trim(),
                sourceUrl: document.getElementById('data-source').value.trim() || null,
                tags: document.getElementById('data-tags').value.trim() || null
            };

            try {
                var method = id ? 'PUT' : 'POST';
                var url = id ? '/DataItem/' + id : '/DataItem';
                await api(url, { method: method, body: JSON.stringify(dto) });

                showToast(id ? 'Updated successfully!' : 'Added successfully!', 'success');
                resetForm();
                loadData(currentPage);
                loadCategories();
            } catch (err) {
                showToast('Save failed: ' + err.message, 'error');
            }
        });

        // ========== Edit Item ==========
        async function editItem(id) {
            try {
                var item = await api('/DataItem/' + id);

                document.getElementById('edit-id').value = item.id;
                document.getElementById('data-title').value = item.title || '';
                document.getElementById('data-description').value = item.description || '';
                document.getElementById('data-category').value = item.category || '';
                document.getElementById('data-source').value = item.sourceUrl || '';
                document.getElementById('data-tags').value = item.tags || '';

                document.getElementById('form-title').textContent = 'Edit Data';
                document.getElementById('submit-btn').textContent = 'Save Changes';
                document.getElementById('cancel-btn').classList.remove('hidden');

                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (err) {
                showToast('Failed to fetch item: ' + err.message, 'error');
            }
        }

        // ========== Cancel Edit ==========
        function cancelEdit() {
            resetForm();
        }

        // ========== Reset Form ==========
        function resetForm() {
            document.getElementById('data-form').reset();
            document.getElementById('edit-id').value = '';
            document.getElementById('form-title').textContent = 'Add Data';
            document.getElementById('submit-btn').textContent = 'Add Data';
            document.getElementById('cancel-btn').classList.add('hidden');
        }

        // ========== Delete Item ==========
        async function deleteItem(id) {
            if (!confirm('Are you sure you want to delete this record?')) return;

            try {
                await api('/DataItem/' + id, { method: 'DELETE' });
                showToast('Deleted successfully!', 'success');
                loadData(currentPage);
                loadCategories();
            } catch (err) {
                showToast('Delete failed: ' + err.message, 'error');
            }
        }

        // ========== Load Category Dropdown ==========
        async function loadCategories() {
            try {
                var data = await api('/DataItem?pageSize=1000');
                var items = data.items || [];

                var cats = [];
                items.forEach(function(i) { if (i.category && cats.indexOf(i.category) === -1) cats.push(i.category); });
                cats.sort();

                var sel = document.getElementById('filter-category');
                sel.innerHTML = '<option value="">All Categories</option>' +
                    cats.map(function(c) { return '<option value="' + esc(c) + '">' + esc(c) + '</option>'; }).join('');
            } catch (err) {
                console.error('Load categories failed:', err);
            }
        }

        // ========== Utilities ==========
        function esc(str) {
            if (!str) return '';
            var d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        function showToast(msg, type) {
            var t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + (type || '');
            t.classList.remove('hidden');
            setTimeout(function() { t.classList.add('hidden'); }, 3000);
        }
    </script>
</body>
</html>
